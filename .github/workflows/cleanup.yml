name: 불필요한 메일 삭제 (매월)

on:
  schedule:
    - cron: "0 2 1 * *"   # 매월 1일 UTC 02:00 (한국 11:00)
  workflow_dispatch:
    inputs:
      categories:
        description: "삭제할 카테고리 (공백 구분): spam promotions social updates trash"
        required: false
        default: "spam promotions"

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: credentials 복원
        run: |
          mkdir -p credentials
          echo "${{ secrets.GMAIL_CREDENTIALS_B64 }}" | base64 -d > credentials/credentials.json

      - name: 토큰 번들 복원
        run: |
          echo "${{ secrets.GMAIL_TOKENS_BUNDLE_B64 }}" | base64 -d | tar xzf -

      - name: 불필요한 메일 삭제 실행
        env:
          GMAIL_EMAILS: ${{ secrets.GMAIL_EMAILS }}
          CLEANUP_CATS: ${{ github.event.inputs.categories || secrets.CLEANUP_CATEGORIES || 'spam promotions' }}
        run: |
          for email in $(echo "$GMAIL_EMAILS" | tr ',' '\n'); do
            echo "=== $email ==="
            python3 main.py --headless --task cleanup --email "$email" \
              --categories $CLEANUP_CATS
          done
